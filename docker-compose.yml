# Starts the three parts of the game together: database, server and website.
# Run:  docker compose up --build     then open http://localhost:5173
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: wsbm
      POSTGRES_USER: wsbm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsbm -d wsbm"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://wsbm:${POSTGRES_PASSWORD}@database:5432/wsbm
      SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env first}
      WORLD_START: ${WORLD_START:-2026-08-03T00:00:00+01:00}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@localhost}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
    environment:
      API_URL: http://server:8000
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  database-data:
